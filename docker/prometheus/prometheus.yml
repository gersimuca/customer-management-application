global:
  scrape_interval: 30s

scrape_configs:
  - job_name: 'erp-app'
    static_configs:
      - targets: ['host.docker.internal:8090']
    metrics_path: /status/prometheus
    scheme: http

  - job_name: 'otel-collector'
    static_configs:
      - targets: [ 'otel-collector:9464' ]

  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]